<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Horizontal Forcé</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            overflow-x: hidden;
        }

        /* Sections normales verticales */
        .section-verticale {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            background: #f0f0f0;
        }

        /* 1. Conteneur principal de l'animation */
        .scroll-container-virtuel {
            /* Hauteur totale du scroll vertical pour faire défiler la zone horizontale */
            height: 400vh; 
            position: relative;
        }

        /* 2. Écran fixe pendant le scroll horizontal */
        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* 3. La bande qui va glisser de gauche à droite */
        .bande-horizontale {
            display: flex;
            height: 100%;
            width: 400vw; /* 4 cartes de 100vw chacune */
            will-change: transform;
        }

        /* 4. Les cartes individuelles */
        .carte {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: white;
        }

        .c1 { background: #111; }
        .c2 { background: #ff4757; }
        .c3 { background: #2ed573; }
        .c4 { background: #1e90ff; }
    </style>
</head>
<body>

    <section class="section-verticale">
        <p>↓ Scrollez vers le bas pour atteindre les personnes ↓</p>
    </section>

    <!-- Zone de scroll horizontal -->
    <div class="scroll-container-virtuel" id="zoneScroll">
        <div class="sticky-wrapper">
            <div class="bande-horizontale" id="bande">
                <div class="carte c1">Équipe (Début)</div>
                <div class="carte c2">Personne 1</div>
                <div class="carte c3">Personne 2</div>
                <div class="carte c4">Personne 3 (Fin)</div>
            </div>
        </div>
    </div>

    <section class="section-verticale">
        <p>↑ Le scroll redevient vertical automatiquement ↑</p>
    </section>

    <script>
        const zoneScroll = document.getElementById('zoneScroll');
        const bande = document.getElementById('bande');

        window.addEventListener('scroll', () => {
            // Position actuelle du haut de la zone par rapport à l'écran
            const topOffset = zoneScroll.getBoundingClientRect().top;
            
            // Hauteur totale scrollable de la zone moins la hauteur de l'écran
            const maxScroll = zoneScroll.offsetHeight - window.innerHeight;
            
            // Calcul de la progression (entre 0 et 1)
            let progression = -topOffset / maxScroll;
            
            // On limite la progression entre 0% et 100%
            progression = Math.max(0, Math.min(1, progression));
            
            // On déplace la bande vers la gauche (jusqu'à -300vw car la 1ère carte est déjà visible)
            const translationMax = 300; 
            bande.style.transform = `translateX(-${progression * translationMax}vw)`;
        });
    </script>

</body>
</html>
